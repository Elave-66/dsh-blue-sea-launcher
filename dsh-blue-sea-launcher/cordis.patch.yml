# ============================================================================
# dsh-blue-sea-launcher —— DSH bundle patch
# ============================================================================
# 这是插件的"挂载声明"。DSH 启动时按 bundle 层栈叠加各插件 patch,
# 本文件会把 dsh-blue-sea-launcher 挂到 Web profile 的配置树上。
#
# 可选配置（覆盖在下方 config 里即可，不写则用默认值）：
#   shortcutName : 桌面快捷方式名（默认 蓝海之约）
#   url          : 打开地址（默认 http://127.0.0.1:3080）
#   port         : 检测端口（默认 3080）
#
# 安装：
#   dsh plugin --profile web add link:<本目录绝对路径>
# ============================================================================

- insert:
    - id: dsh-blue-sea-launcher
      name: dsh-blue-sea-launcher
